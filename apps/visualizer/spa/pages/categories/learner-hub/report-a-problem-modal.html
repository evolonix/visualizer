<div class="tw-grid tw-h-dvh tw-place-items-center">
  <div
    class="tw-w-full tw-max-w-80 tw-rounded-2xl tw-bg-white tw-p-4 tw-shadow-lg sm:tw-max-w-sm md:tw-max-w-md md:tw-p-6 lg:tw-max-w-xl"
    role="dialog"
    aria-labelledby="title"
    aria-describedby="description"
  >
    <div class="tw-mb-6 tw-flex tw-flex-col tw-gap-6">
      <h4 class="tw-font-extrabold tw-text-neutral-900" id="title">Report a Problem</h4>
      <fieldset class="tw-flex tw-flex-col tw-gap-4 tw-pl-4">
        <div class="tw-flex tw-items-center tw-gap-2 has-[:checked]:tw-font-semibold has-[:checked]:tw-text-neutral-900">
          <input type="radio" id="option-1" name="problem" value="option-1" checked />
          <label for="option-1" class="tw-text-neutral-800">I can’t access this link or this link appears to be broken</label>
        </div>
        <div class="tw-flex tw-items-center tw-gap-2 has-[:checked]:tw-font-semibold has-[:checked]:tw-text-neutral-900">
          <input type="radio" id="option-2" name="problem" value="option-2" />
          <label for="option-2" class="tw-text-neutral-800">This content is inappropriate</label>
        </div>
        <div class="tw-flex tw-items-center tw-gap-2 has-[:checked]:tw-font-semibold has-[:checked]:tw-text-neutral-900">
          <input type="radio" id="option-3" name="problem" value="option-3" />
          <label for="option-3" class="tw-text-neutral-800">There is something incorrect about the content</label>
        </div>
        <div class="tw-flex tw-items-center tw-gap-2 has-[:checked]:tw-font-semibold has-[:checked]:tw-text-neutral-900">
          <input type="radio" id="option-4" name="problem" value="option-4" />
          <label for="option-4" class="tw-text-neutral-800">Other</label>
        </div>
      </fieldset>

      <!-- Notice -->
      <div
        class="tw-relative tw-flex tw-items-center tw-gap-2 tw-min-h-10 tw-min-w-full tw-rounded-lg tw-bg-neutral-100 tw-px-3 tw-pl-4 tw-py-2 tw-overflow-hidden before:tw-absolute before:tw-inset-0 before:tw-block before:tw-w-1 before:tw-rounded-l-lg before:tw-bg-neutral-600"
      >
        <!-- Icon: information-circle solid -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="tw-shrink-0 tw-size-4 tw-text-neutral-600">
          <path
            fill-rule="evenodd"
            d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12Zm8.706-1.442c1.146-.573 2.437.463 2.126 1.706l-.709 2.836.042-.02a.75.75 0 0 1 .67 1.34l-.04.022c-1.147.573-2.438-.463-2.127-1.706l.71-2.836-.042.02a.75.75 0 1 1-.671-1.34l.041-.022ZM12 9a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"
            clip-rule="evenodd"
          />
        </svg>
        <p class="tw-text-xs tw-text-neutral-800">
          For other issues, please visit the <a href="" class="tw-font-bold tw-text-blue-800">Degreed Knowledge Center.</a>
        </p>
      </div>
    </div>
    <div class="tw-flex tw-flex-col tw-justify-end tw-gap-2 md:tw-flex-row md:tw-gap-4">
      <button class="tw-btn-secondary-filled tw-btn-medium">Cancel</button>
      <button class="tw-btn-primary tw-btn-medium">Send</button>
    </div>
  </div>
</div>
