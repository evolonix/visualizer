<html-component name="apollo/layout-learner" hide-component="true" title="Home">
  <div class="tw-grid-apollo tw-has-sidebar tw-mt-4 md:tw-mt-24">
    <!-- Welcome Section -->
    <div class="tw-flex tw-animate-pulse tw-items-center tw-space-x-4">
      <div class="tw-rounded-full tw-border-2 tw-border-neutral-300 tw-bg-transparent tw-p-0.5">
        <div class="tw-h-16 tw-min-w-16 tw-rounded-full tw-bg-neutral-300"></div>
      </div>
      <div class="tw-flex tw-flex-col">
        <div class="tw-mb-2 tw-h-6 tw-w-52 tw-rounded-full tw-bg-neutral-300"></div>
        <div class="tw-h-4 tw-w-60 tw-rounded-full tw-bg-neutral-300 sm:tw-w-80"></div>
      </div>
    </div>

    <!-- Learning Tabs -->
    <div class="tw-col-span-full tw-hidden tw-rounded-xl tw-bg-white tw-p-6 tw-shadow-md sm:tw-block">
      <div
        role="tablist"
        aria-labelledby="tablist-1"
        class="tw-mb-6 tw-flex tw-justify-between tw-gap-x-8 tw-border-b tw-border-neutral-200 md:tw-justify-start lg:tw-gap-x-20"
      >
        <button
          id="tab-1"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="tabpanel-1"
          class="tw-group tw-relative tw-flex tw-items-center tw-gap-x-2 tw-pb-4 after:tw-absolute after:tw-bottom-0 after:tw-left-0 after:tw-right-0 after:tw-block after:tw-h-1 after:tw-rounded-t-lg after:tw-bg-blue-800"
        >
          <span class="tw-font-extrabold tw-text-neutral-600 group-hover:tw-text-neutral-800">Assigned Learning</span>
          <span
            class="tw-hidden tw-h-6 tw-animate-pulse tw-rounded-full tw-bg-neutral-300 md:tw-inline-flex md:tw-min-w-8 lg:tw-min-w-16"
          ></span>
        </button>
        <button
          id="tab-2"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="tabpanel-2"
          tabindex="-1"
          class="tw-group tw-flex tw-items-center tw-gap-x-2 tw-pb-4 tw-text-neutral-600 hover:tw-text-neutral-800"
        >
          <span class="tw-font-extrabold tw-text-neutral-600 group-hover:tw-text-neutral-800">Continue Learning</span>
          <span
            class="tw-hidden tw-h-6 tw-animate-pulse tw-rounded-full tw-bg-neutral-300 md:tw-inline-flex md:tw-min-w-8 lg:tw-min-w-16"
          ></span>
        </button>
        <button
          id="tab-3"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="tabpanel-3"
          tabindex="-1"
          class="tw-group tw-flex tw-items-center tw-gap-x-2 tw-pb-4 tw-text-neutral-600 hover:tw-text-neutral-800"
        >
          <span class="tw-font-extrabold tw-text-neutral-600 group-hover:tw-text-neutral-800">Personalized Learning</span>
        </button>
      </div>

      <div id="tabpanel-1" role="tabpanel" aria-labelledby="tab-1">
        <div class="tw-flex tw-animate-pulse tw-items-center">
          <div class="tw-h-10 tw-w-16 tw-rounded tw-bg-neutral-300"></div>
          <div class="tw-ml-3">
            <div class="tw-mb-1 tw-h-4 tw-w-96 tw-rounded-full tw-bg-neutral-300"></div>
            <div class="tw-h-2 tw-w-52 tw-rounded-full tw-bg-neutral-300"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Skeleton State for Learning Tabs on xs -->
    <div class="tw-col-span-full tw-block tw-rounded-xl tw-p-6 tw-shadow-md sm:tw-hidden">
      <h4 class="tw-mb-5 tw-font-extrabold tw-text-neutral-800">Assigned Learning</h4>
      <div class="tw-flex tw-animate-pulse tw-items-center">
        <div class="tw-h-10 tw-w-16 tw-rounded tw-bg-neutral-300"></div>
        <div class="tw-ml-3 tw-grow">
          <div class="tw-mb-1 tw-h-4 tw-w-full tw-rounded-full tw-bg-neutral-300"></div>
          <div class="tw-h-2 tw-w-32 tw-rounded-full tw-bg-neutral-300"></div>
        </div>
      </div>
    </div>

    <div class="tw-col-span-full tw-block tw-rounded-xl tw-p-6 tw-shadow-md sm:tw-hidden">
      <h4 class="tw-mb-5 tw-font-extrabold tw-text-neutral-800">Continue Learning</h4>
      <div class="tw-flex tw-animate-pulse tw-items-center">
        <div class="tw-h-10 tw-w-16 tw-rounded tw-bg-neutral-300"></div>
        <div class="tw-ml-3 tw-grow">
          <div class="tw-mb-1 tw-h-4 tw-w-full tw-rounded-full tw-bg-neutral-300"></div>
          <div class="tw-h-2 tw-w-32 tw-rounded-full tw-bg-neutral-300"></div>
        </div>
      </div>
    </div>

    <div class="tw-col-span-full tw-block tw-rounded-xl tw-p-6 tw-shadow-md sm:tw-hidden">
      <h4 class="tw-mb-5 tw-font-extrabold tw-text-neutral-800">Personalized Learning</h4>
      <div class="tw-flex tw-animate-pulse tw-items-center">
        <div class="tw-h-10 tw-w-16 tw-rounded tw-bg-neutral-300"></div>
        <div class="tw-ml-3 tw-grow">
          <div class="tw-mb-1 tw-h-4 tw-w-full tw-rounded-full tw-bg-neutral-300"></div>
          <div class="tw-h-2 tw-w-32 tw-rounded-full tw-bg-neutral-300"></div>
        </div>
      </div>
    </div>

    <!-- Quick Links -->
    <div class="tw-col-span-full tw-rounded-lg tw-bg-white tw-text-center tw-shadow-md">
      <div class="tw-inline-flex tw-w-full tw-max-w-screen-xl tw-flex-col tw-items-start tw-gap-2 tw-p-6">
        <div class="tw-inline-flex">
          <div class="tw-h-6 tw-w-52 tw-animate-pulse tw-rounded-full tw-bg-neutral-300"></div>
        </div>
        <nav class="tw-w-full">
          <div class="tw-my-6 tw-max-w-44 tw-animate-pulse">
            <div class="tw-mb-6 tw-h-5 tw-rounded-full tw-bg-neutral-300"></div>
            <div class="tw-mb-6 tw-h-5 tw-rounded-full tw-bg-neutral-300"></div>
            <div class="tw-mb-6 tw-h-5 tw-rounded-full tw-bg-neutral-300"></div>
            <div class="tw-mb-6 tw-h-5 tw-rounded-full tw-bg-neutral-300"></div>
            <div class="tw-h-5 tw-rounded-full tw-bg-neutral-300"></div>
          </div>
        </nav>
      </div>
    </div>
  </div>
</html-component>
