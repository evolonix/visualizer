<!-- Table -->
<div class="tw-overflow-hidden tw-rounded-lg tw-border tw-border-neutral-200 tw-bg-white">
  <table class="tw-w-full">
    <thead>
      <tr class="tw-border-b tw-border-neutral-200 tw-text-left">
        <th class="tw-h-16 tw-w-full tw-px-4 tw-text-sm tw-font-extrabold tw-leading-4 lg:tw-w-1/3">Rule Name</th>
        <th class="tw-hidden tw-h-16 tw-w-1/3 tw-px-4 tw-text-sm tw-font-extrabold tw-leading-4 lg:tw-table-cell">Conditions</th>
        <th class="tw-hidden tw-h-16 tw-w-1/3 tw-px-4 tw-text-sm tw-font-extrabold tw-leading-4 lg:tw-table-cell">Actions</th>
        <th><span class="tw-sr-only">Edit & Delete</span></th>
      </tr>
    </thead>
    <tbody>
      <!-- Hovered row: cursor-pointer hover:bg-neutral-100, Selected row: [ngClass]="selectedIDs.includes(rule.id) ? 'bg-neutral-100' : ''" -->
      <tr class="tw-border-b tw-border-neutral-200 last:tw-border-b-0" *ngFor="let rule of rules; trackBy: trackRule">
        <td class="tw-h-16 tw-px-4 tw-text-sm">{{ rule.ruleName }}</td>
        <td class="tw-hidden tw-h-16 tw-px-4 tw-text-sm lg:tw-table-cell">
          <span *ngFor="let rule of rule.predicates">{{ getEventDisplay(rule.comparisonValue) }}<br /></span>
        </td>
        <td class="tw-hidden tw-h-16 tw-px-4 tw-text-sm lg:tw-table-cell">Send Email</td>
        <td class="tw-h-16 tw-px-4 tw-text-sm">
          <div class="tw-flex tw-gap-x-8">
            <button type="button" class="tw-text-blue-700 hover:tw-text-blue-800" (click)="onRuleEdit(rule)">Edit</button>
            <button type="button" class="tw-text-red-700 hover:tw-text-red-800" (click)="onRuleDelete(rule)">Delete</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
