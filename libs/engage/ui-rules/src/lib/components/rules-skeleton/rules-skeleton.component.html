<!-- Table -->
<div class="overflow-hidden rounded-lg border border-neutral-200 bg-white">
  <table class="w-full">
    <thead>
      <tr class="border-b border-neutral-200 text-left">
        <th class="h-16 w-full animate-pulse px-4 text-sm font-extrabold leading-4 lg:w-1/3">
          <div class="h-4 w-36 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
        </th>
        <th class="hidden h-16 w-1/3 animate-pulse px-4 text-sm font-extrabold leading-4 lg:table-cell">
          <div class="h-4 w-24 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
        </th>
        <th class="hidden h-16 w-1/3 animate-pulse px-4 text-sm font-extrabold leading-4 lg:table-cell">
          <div class="h-4 w-24 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
        </th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr class="border-b border-neutral-200 last:border-b-0" *ngFor="let i of items">
        <td class="h-16 animate-pulse px-4 text-sm">
          <div class="h-4 w-48 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
        </td>
        <td class="hidden h-16 animate-pulse px-4 text-sm lg:table-cell">
          <div class="h-4 w-64 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
        </td>
        <td class="hidden h-16 animate-pulse px-4 text-sm lg:table-cell">
          <div class="h-4 w-48 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
        </td>
        <td class="h-16 animate-pulse px-4 text-sm">
          <div class="flex gap-x-8">
            <div class="h-2 w-6 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
            <div class="h-2 w-6 rounded-full bg-neutral-200 dark:bg-neutral-700"></div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
