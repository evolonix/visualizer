<ng-container *ngIf="vm$ | async as vm">
  <main class="tw-grid-apollo tw-py-16" *ngIf="vm.requestStatus?.value !== 'error'; else error">
    <div class="tw-col-span-full tw-pt-16 md:tw-col-span-10 md:tw-col-start-2 lg:tw-col-span-8 lg:tw-col-start-auto">
      <h1 class="tw-text-4xl tw-font-bold">Rules</h1>
      <p class="tw-mt-2">
        Rules contain conditions and actions. They can be used to customize the Degreed learning experience and send communication to
        learners.
      </p>
    </div>
    <div
      class="tw-col-span-full tw-flex tw-md:col-span-10 md:tw-col-start-2 lg:tw-col-span-4 lg:tw-col-start-auto lg:tw-items-end lg:tw-justify-end"
      *ngIf="vm.allRules.length"
    >
      <a routerLink="/rules/add" class="tw-btn-primary">
        <!-- Icon: Action / Add / Default / Mini -->
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M8.59961 2.19998C8.59961 1.8686 8.33098 1.59998 7.99961 1.59998C7.66824 1.59998 7.39961 1.8686 7.39961 2.19998V7.39998H2.19961C1.86824 7.39998 1.59961 7.6686 1.59961 7.99998C1.59961 8.33135 1.86824 8.59998 2.19961 8.59998H7.39961V13.8C7.39961 14.1313 7.66824 14.4 7.99961 14.4C8.33098 14.4 8.59961 14.1313 8.59961 13.8V8.59998H13.7996C14.131 8.59998 14.3996 8.33135 14.3996 7.99998C14.3996 7.6686 14.131 7.39998 13.7996 7.39998H8.59961V2.19998Z"
            class="tw-fill-current"
          />
        </svg>
        Create a Rule
      </a>
    </div>

    <div class="tw-col-span-full md:tw-col-span-10 md:tw-col-start-2 lg:tw-col-span-full">
      <ng-container *ngIf="!vm.isLoading; else initializing">
        <ng-container *ngIf="!vm.showSkeleton; else loading">
          <ng-container *ngIf="vm.allRules.length; else noRules">
            <!-- Rules list -->
            <dgs-rules-list
              [rules]="vm.allRules"
              [selectedIDs]="vm.selectedIDs"
              (onRuleSelected)="vm.selectRule($event)"
              (onRuleDeleted)="vm.deleteRule($event)"
            >
              <!-- Pagination -->
              <!-- <dgs-paginator [pagination]="vm.pagination"></dgs-paginator> -->
            </dgs-rules-list>
          </ng-container>
        </ng-container>
      </ng-container>
    </div>
  </main>
</ng-container>

<ng-template #initializing>
  <div class="tw-h-[400px] tw-rounded-lg tw-bg-neutral-100"></div>
</ng-template>

<ng-template #loading>
  <dgs-rules-skeleton></dgs-rules-skeleton>
</ng-template>

<ng-template #noRules>
  <dgs-rules-empty-state></dgs-rules-empty-state>
</ng-template>

<ng-template #error>
  <dgs-rules-error-state></dgs-rules-error-state>
</ng-template>
