      type="button"
      class="btn-icon btn-neutral"
      id="menu-button"
      aria-expanded="true"
      aria-haspopup="true"
      (click)="toggleMenu()"
      cdkOverlayOrigin
      #trigger="cdkOverlayOrigin"
    >

        <path
          d="M14 9C15.1046 9 16 9.89543 16 11V14C16 15.1046 15.1046 16 14 16H11C9.89543 16 9 15.1046 9 14V11C9 9.89543 9.89543 9 11 9H14ZM5 9C6.10457 9 7 9.89543 7 11V14C7 15.1046 6.10457 16 5 16H2C0.89543 16 0 15.1046 0 14V11C0 9.89543 0.89543 9 2 9H5ZM5 0C6.10457 0 7 0.89543 7 2V5C7 6.10457 6.10457 7 5 7H2C0.89543 7 0 6.10457 0 5V2C0 0.89543 0.89543 0 2 0H5ZM14 0C15.1046 0 16 0.89543 16 2V5C16 6.10457 15.1046 7 14 7H11C9.89543 7 9 6.10457 9 5V2C9 0.89543 9.89543 0 11 0H14Z"

  <ng-template
    cdkConnectedOverlay
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    [cdkConnectedOverlayHasBackdrop]="true"
    [cdkConnectedOverlayOrigin]="trigger"
    [cdkConnectedOverlayOpen]="isMenuOpen"
    (detach)="isMenuOpen = false"
    (backdropClick)="isMenuOpen = false"
  >
    <!--
    Dropdown menu, show/hide based on menu state.

    Entering: "transition ease-out duration-100"
      From: "transform opacity-0 scale-95"
      To: "transform opacity-100 scale-100"
    Leaving: "transition ease-in duration-75"
      From: "transform opacity-100 scale-100"
      To: "transform opacity-0 scale-95"
  -->
    <div
      @ProductSwitcherMenuTrigger
      class="mt-2 w-56 rounded-md bg-white px-3 py-6 shadow-md ring-1 ring-black ring-opacity-5 focus:outline-none"
      role="menu"
      aria-orientation="vertical"
      aria-labelledby="menu-button"
      tabindex="-1"
    >
      <h4 class="px-3 font-extrabold">Switch To</h4>
